[project]
name = "enermax-crm"
version = "0.1.0"
description = "Enermax CRM Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.32",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.3",
    "redis>=5.0.0",
    "pyjwt[crypto]>=2.9.0",
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.2.0",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]
