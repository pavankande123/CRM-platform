name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: enermax_user
          POSTGRES_PASSWORD: enermax_secure_password
          POSTGRES_DB: enermax_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Lint Code with Ruff
        run: |
          ruff check backend

      - name: Run Backend Test Suite (Pytest)
        env:
          APP_ENV: testing
          DEBUG: "true"
          SECRET_KEY: "ci-pipeline-temporary-secret-key-minimum-32-chars"
          DATABASE_URL: "postgresql+asyncpg://enermax_user:enermax_secure_password@localhost:5432/enermax_crm_test"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          pytest backend/tests -v --tb=short

  frontend-checks:
    name: Frontend Type Check & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Type Check & Production Build
        run: npm run build
